<script type="module">

  const arr=i<=570?"Timely":i<=585?"Grace":"Late";let hrs;

 o.P=o.Timely+o.Grace+o.Late;const h=o.Met+o.Under+o["Early Off"];

 const a=$("#fe"),b=$("#fm");if(a)a.onchange=()=>{fe=+a.value;if($("#ee"))$("#ee").value=fe;renderD()};if(b)b.onchange=()=>{fm=+b.value;renderD()};

 if(tab==="dash")dash();if(tab==="entry")entry();if(tab==="leave")leaves()}
function balTable(){return `<div class="tw"><table><tr><th>Employee</th><th>Annual Used</th><th>Annual Left</th><th>Casual Used</th><th>Casual Left</th><th>Medical Used</th><th>Medical Left</th></tr>

 ${EMP.map((n,e)=>"<tr><td><b>"+esc(n)+"</b></td>"+["Annual","Casual","Medical"].map(t=>{const u=used(e,t),l=QUOTA[t]-u;return `<td>${u}</td><td>${l<0?`<span class="t Neg">${l}</span>`:l}</td>`}).join("")+"</tr>").join("")}</table></div>`}

 ${EMP.map((n,i)=>{const t=stats(i,YEAR,m);return `<tr><td><b>${esc(n)}</b></td><td>${t.P}</td><td>${t.Late}</td><td>${t.Leave}</td><td>${P(t.pun)}</td><td>${P(t.comp)}</td><td>${P(t.score)}<div class="pb"><i style="width:${Math.round((t.score||0)*100)}%"></i></div></td><td>${tag(t.risk)}</td></tr>`}).join("")}</table></div></section>

 if(!window.Chart)return;Chart.defaults.color=getComputedStyle(document.documentElement).getPropertyValue("--mu");

function entry(){const e=fe,m=fm,rows=[];
 for(let d=1;d<=dim(YEAR,m);d++){const s=iso(YEAR,m,d),x=info(e,s),r=x.r||[],cls=x.typ==="off"?"off":x.typ==="lv"?"lv":"";

 $("#d").onclick=async ev=>{const b=ev.target.closest("button");if(b&&confirm("Delete this leave?"))try{await deleteDoc(doc(fs,"users",EM[+b.dataset.e],"lv",b.dataset.id))}catch(x){msg("Could not delete.")}}}

setTab("dash");
function track(list){subs.forEach(f=>f());subs=[];att={};lv=[];EMP=list.map(p=>p.name);EM=list.map(p=>p.email);HR=list.map(p=>p.hr||"");fe=0;setTab(tab);
 list.forEach((p,i)=>{subs.push(onSnapshot(collection(fs,"users",p.email,"att"),sn=>{sn.docs.forEach(d=>att[i+"_"+d.id]=d.data());renderD()},()=>msg("Could not load data.")));
  subs.push(onSnapshot(collection(fs,"users",p.email,"lv"),sn=>{lv=lv.filter(l=>l.e!==i).concat(sn.docs.map(d=>Object.assign({},d.data(),{id:d.id,e:i})));renderD()},()=>msg("Could not load leaves.")))})}
async function hrRead(ev){const f=ev.target.files[0];if(!f)return;const box=$("#hp");box.textContent="Reading...";
 try{if(!window.pdfjsLib)throw Error("PDF reader not loaded");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,lines=[];
  for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent(),g={};tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/4);(g[y]=g[y]||[]).push(it)});

  const T=s=>{const m=s.match(/(\d{1,2}):(\d{2}):\d{2}\s*([AP])M/);return m?pad((+m[1])%12+(m[3]==="P"?12:0))+":"+m[2]:""},by={};
  lines.forEach(l=>{const m=l.match(/^\s*(\d+)\s+(.+?)\s+(\d{1,2})\/(\d{1,2})\/(\d{4})\s+[A-Za-z]+day\s*(.*)$/);if(!m)return;
   const d=iso(+m[5],+m[3],+m[4]),r=m[6],tm=[...r.matchAll(/\d{1,2}:\d{2}:\d{2}\s*[AP]M/g)].map(x=>x[0]),k=m[1]+"|"+m[2],o=by[k]=by[k]||{id:m[1],nm:m[2],att:{},lv:[],un:[]};
   if(tm.length){let out=tm.length>1?T(tm[1]):"",rm=(r.match(/Approved by.*$/i)||[""])[0];if(/Half Day/i.test(r)){rm="Half Day";if(tm.length===2){const w=tm[1].match(/(\d+):(\d+)/),a=T(tm[0]).split(":"),t=+a[0]*60+ +a[1]+ +w[1]*60+ +w[2];out=pad(Math.floor(t/60))+":"+pad(t%60)}}o.att[d]=[T(tm[0]),out,rm]}
   else{const t=(r.match(/\b(Sick|Casual|Annual)\b/i)||[])[1];if(/Absent/i.test(r)&&!t)o.un.push(d);if(/Absent/i.test(r)&&t)o.lv.push({t:t.toLowerCase()==="sick"?"Medical":t[0].toUpperCase()+t.slice(1).toLowerCase(),d})}});

  box.innerHTML=HRD.length?`<div class="tw"><table><tr><th>HR employee</th><th>Matched with</th><th>Present days</th><th>Leave days</th></tr>${HRD.map(o=>`<tr><td>${esc(o.id+" "+o.nm)}</td><td>${o.i>=0?esc(EMP[o.i]):'<span class="t Late">Not matched - add HR ID in People</span>'}</td><td>${Object.keys(o.att).length}</td><td>${o.lv.length}${o.un.length?` (+${o.un.length} absent days without leave type, skipped)`:""}</td></tr>`).join("")}</table></div><p><button class="go" id="hs">Save to attendance</button></p>`:"No attendance rows found in this PDF.";
  if(HRD.length)$("#hs").onclick=hrSave}catch(x){box.textContent="Could not read file: "+(x.message||x)}}
async function hrSave(){let n=0;try{for(const o of HRD){if(o.i<0)continue;const mo={};for(const d in o.att)(mo[d.slice(0,7)]=mo[d.slice(0,7)]||{})[d.slice(8)]=o.att[d];
  for(const k in mo){const ref=doc(fs,"users",EM[o.i],"att",k),sn=await getDoc(ref);await setDoc(ref,{days:Object.assign({},(sn.exists()&&sn.data().days)||{},mo[k])});n+=Object.keys(mo[k]).length}
